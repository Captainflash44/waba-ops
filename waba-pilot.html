<!DOCTYPE html>
<!-- WABA Pilot v3.0 - Optimized -->
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WABA — Espace Pilote</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700&family=JetBrains+Mono:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --sidebar-w:228px;--radius:10px;--radius-sm:6px;--transition:.2s ease;
      --font-display:'Playfair Display',serif;--font-mono:'JetBrains Mono',monospace;--font-body:'DM Sans',sans-serif;
      --gold:#B8973E;--gold-light:#D4AF60;--blue:#4A9BB8;--green:#5A9E6F;--orange:#C47A3A;--red:#B85A4A;
    }
    [data-theme="dark"]{
      --bg:#0C0C0E;--bg2:#111114;--bg3:#16161A;--bg4:#1C1C22;
      --border:#252530;--border2:#32323E;
      --text:#E8E6E0;--text2:#7A7880;--text3:#42404A;
      --sidebar-bg:#0A0A0C;--card-bg:#111114;--hover:#1A1A1E;--input-bg:#0E0E12;
      --shadow:0 2px 20px rgba(0,0,0,.5);
    }
    [data-theme="light"]{
      --bg:#F4F2EE;--bg2:#ECEAE6;--bg3:#E4E2DE;--bg4:#DCDAD6;
      --border:#D0CEC8;--border2:#B8B6B0;
      --text:#1A1816;--text2:#5A5856;--text3:#9A9896;
      --sidebar-bg:#1A1816;--card-bg:#F8F6F2;--hover:#E8E6E2;--input-bg:#ECEAE6;
      --shadow:0 2px 20px rgba(0,0,0,.08);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:13px;line-height:1.5;min-height:100vh;overflow-x:hidden;transition:background var(--transition),color var(--transition);}
    #sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:100;}
    [data-theme="light"] #sidebar{background:#1A1816;border-right-color:#2A2826;}
    .sb-header{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.06);}
    .sb-logo{font-family:var(--font-display);font-size:22px;font-weight:700;color:#fff;letter-spacing:6px;margin-bottom:1px;}
    .sb-tag{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.25);margin-bottom:10px;}
    .pilot-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius-sm);padding:10px 12px;margin-top:8px;}
    .pilot-name{font-size:13px;color:#fff;font-weight:600;margin-bottom:2px;}
    .pilot-role{font-size:9px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:2px;}
    .pilot-ratings{display:flex;gap:4px;margin-top:4px;}
    .rating-badge{font-size:8px;font-weight:700;font-family:var(--font-mono);padding:2px 6px;border-radius:3px;background:rgba(184,151,62,.15);color:var(--gold);border:1px solid rgba(184,151,62,.3);}
    nav{flex:1;padding:8px 8px;overflow-y:auto;scrollbar-width:none;}
    nav::-webkit-scrollbar{display:none;}
    .nav-sec{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.18);padding:10px 10px 5px;font-family:var(--font-mono);}
    .nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;margin-bottom:2px;font-size:12px;font-weight:500;color:rgba(255,255,255,.42);border:1px solid transparent;transition:all var(--transition);position:relative;}
    .nav-item:hover{color:rgba(255,255,255,.72);background:rgba(255,255,255,.04);}
    .nav-item.active{color:#fff;background:rgba(184,151,62,.12);border-color:rgba(184,151,62,.25);}
    .nav-icon{font-size:13px;width:18px;text-align:center;flex-shrink:0;}
    .nav-item.active .nav-icon{color:var(--gold);}
    .nav-badge{position:absolute;right:8px;background:var(--orange);border-radius:10px;padding:1px 6px;font-size:9px;font-weight:700;color:#fff;font-family:var(--font-mono);}
    .sb-footer{padding:10px 12px;border-top:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;gap:6px;}
    .theme-row{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:rgba(255,255,255,.04);border-radius:var(--radius-sm);cursor:pointer;border:1px solid rgba(255,255,255,.07);}
    .theme-lbl{font-size:9px;color:rgba(255,255,255,.35);font-family:var(--font-mono);letter-spacing:1px;}
    .theme-sw{width:28px;height:16px;background:rgba(255,255,255,.1);border-radius:8px;position:relative;transition:background var(--transition);}
    .theme-sw::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.45);transition:transform var(--transition);}
    [data-theme="light"] .theme-sw{background:var(--gold);}
    [data-theme="light"] .theme-sw::after{transform:translateX(12px);background:#fff;}
    .auth-btn{width:100%;background:transparent;border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.38);border-radius:var(--radius-sm);padding:7px 10px;cursor:pointer;font-size:11px;font-family:var(--font-body);text-align:left;transition:all var(--transition);display:flex;align-items:center;gap:6px;}
    .auth-btn:hover{border-color:var(--orange);color:var(--orange);}
    .admin-link{display:flex;align-items:center;gap:6px;padding:6px 10px;background:rgba(184,151,62,.07);border:1px solid rgba(184,151,62,.18);border-radius:var(--radius-sm);color:rgba(184,151,62,.8);font-size:10px;font-family:var(--font-body);text-decoration:none;}
    #main{margin-left:var(--sidebar-w);min-height:100vh;padding:26px 30px;}
    .page{display:none;}
    .page.active{display:block;animation:fadeIn .2s ease;}
    @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
    .page-title{font-family:var(--font-display);font-size:24px;font-weight:500;margin-bottom:2px;}
    .page-sub{font-size:11px;color:var(--text2);margin-bottom:22px;font-family:var(--font-mono);}
    .sec-title{font-size:10px;font-weight:700;color:var(--text2);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;font-family:var(--font-mono);}
    .card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
    .card-sm{padding:12px 14px;}
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
    .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
    .kpi{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
    .kpi-lbl{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text2);margin-bottom:7px;font-family:var(--font-mono);}
    .kpi-val{font-family:var(--font-mono);font-size:26px;font-weight:700;line-height:1;margin-bottom:3px;}
    .kpi-sub{font-size:11px;color:var(--text2);}
    .badge{display:inline-block;border-radius:4px;padding:2px 8px;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;font-family:var(--font-mono);}
    .btn{border:none;border-radius:var(--radius-sm);padding:7px 14px;cursor:pointer;font-size:11px;font-weight:600;font-family:var(--font-body);transition:all var(--transition);display:inline-flex;align-items:center;gap:5px;}
    .btn-gold{background:var(--gold);color:#fff;}
    .btn-gold:hover{background:var(--gold-light);}
    .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2);}
    .btn-ghost:hover{border-color:var(--border2);color:var(--text);}
    .btn-blue{background:rgba(74,155,184,.14);border:1px solid rgba(74,155,184,.3);color:var(--blue);}
    .btn-green{background:rgba(90,158,111,.14);border:1px solid rgba(90,158,111,.3);color:var(--green);}
    .btn-orange{background:rgba(196,122,58,.14);border:1px solid rgba(196,122,58,.3);color:var(--orange);}
    .form-lbl{display:block;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text2);margin-bottom:6px;font-family:var(--font-mono);}
    .form-input{width:100%;background:var(--input-bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;color:var(--text);font-family:var(--font-body);font-size:13px;outline:none;transition:border-color var(--transition);}
    .form-input:focus{border-color:var(--gold);}
    textarea.form-input{resize:vertical;min-height:80px;}
    .seg-row{display:flex;align-items:center;gap:10px;background:var(--bg3);border-radius:var(--radius-sm);padding:9px 12px;margin-bottom:6px;border-left:3px solid var(--border);}
    .rot-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
    #range-map{height:400px;border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;}
    #toast{position:fixed;top:20px;right:20px;z-index:3000;border-radius:var(--radius-sm);padding:10px 16px;font-size:12px;font-weight:600;display:none;box-shadow:var(--shadow);max-width:320px;}
    .divider{height:1px;background:var(--border);margin:14px 0;}
    .mono{font-family:var(--font-mono);}
    .fw7{font-weight:700;}
    .text-gold{color:var(--gold);}
    .text-blue{color:var(--blue);}
    .text-green{color:var(--green);}
    .text-orange{color:var(--orange);}
    .text-muted{color:var(--text2);}
    .mb8{margin-bottom:8px;}.mb12{margin-bottom:12px;}.mb16{margin-bottom:16px;}.mb20{margin-bottom:20px;}.mt12{margin-top:12px;}
    @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
    .btab{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--text2);padding:10px 13px;cursor:pointer;font-size:10px;font-weight:700;font-family:
